<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Spotify Downloader</h1>
    <h2>Search Results</h2>
    <form action="/download" method="post">
        {% for track in track_infos %}
            <div class="track-info">
                <h2>{{ track.track_title }} by {{ track.artist_name }}</h2>
                <a href="{{ track.link }}" target="_blank">Watch on YouTube</a><br>
                <img src="{{ track.poster }}" alt="YouTube Thumbnail">
                <input type="checkbox" name="youtube_links" value="{{ track.link }}"> Download
            </div>
        {% endfor %}
        <button type="submit">Download Selected</button>
