<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Spotify Downloader</h1>
    <h2>Search Results</h2>
    <form action="/download" method="post">
        <input type="text" name="download_path" placeholder="Enter download path" required><br><br>
        {% for track in track_infos %}
            <div class="track-info">
                <h3>{{ track.track_title }} by {{ track.artist_name }}</h3>
                <a href="{{ track.link }}" target="_blank">Watch on YouTube</a><br>
                <img src="{{ track.poster }}" alt="YouTube Thumbnail">
                <input type="checkbox" name="youtube_links" value="{{ track.link }}"> Download
            </div>
        {% endfor %}
        <button type="submit">Download Selected</button>
    </form>
    <form action="/download_all" method="post">
        <input type="hidden" name="download_path" value="{{ request.form.get('download_path') }}">
        {% for track in track_infos %}
            <input type="hidden" name="all_links" value="{{ track.link }}">
        {% endfor %}
        <button type="submit">Download All</button>
    </form>
</body>
</html>
